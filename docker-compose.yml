# Real MongoDB for local development:  docker compose up -d
services:
  mongo:
    image: mongo:7
    container_name: product_reco_mongo
    ports: ["127.0.0.1:27017:27017"]     # bound to localhost only
    volumes: ["mongo_data:/data/db"]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s
    restart: unless-stopped
volumes:
  mongo_data:
